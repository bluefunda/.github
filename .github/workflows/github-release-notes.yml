name: GitHub Release Notes

# Populates a GitHub release body with structured notes generated by the
# release-foundry tool. Call it after release-please creates a release.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to annotate (e.g. v1.2.0)'
        required: true
        type: string
      mode:
        description: 'replace (overwrite release body) or append (add after existing body)'
        required: false
        type: string
        default: 'replace'
      days-fallback:
        description: Days to look back when there is no previous release.
        required: false
        type: number
        default: 3650
      release-foundry-repo:
        description: release-foundry repo to build the tool from (org/repo).
        required: false
        type: string
        default: 'bluefunda/release-foundry'
      runner:
        description: 'Runner label. Empty (default) picks by repository visibility: self-hosted for private repos, ubuntu-latest (GitHub-hosted) for public ones.'
        required: false
        type: string
        default: ''
    secrets:
      GH_PAT:
        description: 'GitHub PAT — required to check out release-foundry and access private repos'
        required: false

jobs:
  release-notes:
    name: Generate Release Notes
    runs-on: ${{ inputs.runner || (github.event.repository.private && 'self-hosted') || 'ubuntu-latest' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout release-foundry
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.release-foundry-repo }}
          ref: main
          path: _rf
          token: ${{ secrets.GH_PAT || github.token }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: _rf/go.mod
          cache: ${{ !contains(inputs.runner, 'self-hosted') }}
          cache-dependency-path: _rf/go.sum

      - name: Build
        run: go build -o "$RUNNER_TEMP/rf" ./cmd/release-foundry
        working-directory: _rf

      - name: Get previous release date
        id: prev
        run: |
          SINCE=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 20 --json tagName,publishedAt,isDraft,isPrerelease --order desc \
            | jq -r --arg tag "$TAG" \
              '[.[] | select(.tagName != $tag and (.isDraft | not) and (.isPrerelease | not))] | .[0].publishedAt // empty')
          echo "since=${SINCE}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          SINCE: ${{ steps.prev.outputs.since }}
          DAYS_FALLBACK: ${{ inputs.days-fallback }}
        run: |
          OUT="$RUNNER_TEMP/rf-out"
          mkdir -p "$OUT"
          if [ -n "$SINCE" ]; then
            WINDOW=(-since "$SINCE")
          else
            WINDOW=(-days "$DAYS_FALLBACK")
          fi
          "$RUNNER_TEMP/rf" -owner "${GITHUB_REPOSITORY%%/*}" -repo "${GITHUB_REPOSITORY##*/}" \
            "${WINDOW[@]}" -render github-release -out "$OUT"

      - name: Update GitHub release body
        env:
          MODE: ${{ inputs.mode }}
        run: |
          RF_FILE=$(ls "$RUNNER_TEMP"/rf-out/*-github-release.md 2>/dev/null | head -1)
          if [ -z "$RF_FILE" ]; then
            echo "No labeled PRs found in window — skipping release body update."
            exit 0
          fi
          NOTES="$RUNNER_TEMP/notes.md"
          if [ "$MODE" = "append" ]; then
            EXISTING=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
            printf '%s\n\n---\n\n%s' "$EXISTING" "$(cat "$RF_FILE")" > "$NOTES"
          else
            cp "$RF_FILE" "$NOTES"
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
