name: Release Please

on:
  workflow_call:
    inputs:
      release-type:
        description: 'Release-please release type (go, node, simple, etc.)'
        required: false
        type: string
        default: 'go'
      auto-merge:
        description: >
          Approve the release PR and enable squash auto-merge, so every
          releasable commit on main is released without a manual merge.
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner label. Empty (default) picks by repository visibility: self-hosted for private repos, ubuntu-latest (GitHub-hosted) for public ones.'
        required: false
        type: string
        default: ''
    secrets:
      GH_PAT:
        description: 'GitHub PAT to trigger downstream workflows from release-please commits'
        required: false
    outputs:
      release_created:
        description: 'Whether a release was created'
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: 'The tag name of the release'
        value: ${{ jobs.release-please.outputs.tag_name }}

jobs:
  release-please:
    runs-on: ${{ inputs.runner || (github.event.repository.private && 'self-hosted') || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          release-type: ${{ inputs.release-type }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Auto-approve and merge the release PR
        if: inputs.auto-merge && steps.release.outputs.pr != ''
        env:
          # github.token (github-actions[bot]) approves the PR that GH_PAT
          # opened: different actors, so GitHub allows the approval.
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.GH_PAT || github.token }}
          # Through the environment, never inlined into the script: the PR
          # body holds commit messages that can break shell quoting.
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(printf '%s' "$RELEASE_PR" | jq -r '.number // empty')
          [ -z "$PR_NUMBER" ] && exit 0
          gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --approve --body "Auto-approved by CI — release-please version bump, no functional changes."
          GH_TOKEN="$MERGE_TOKEN" \
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto
