name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: >
          Go version override. Leave empty to use the org pin
          (.github/actions/versions/Dockerfile in bluefunda/.github).
        required: false
        type: string
        default: ''
      goprivate:
        description: >
          GOPRIVATE value for private module access.
          Set to 'github.com/bluefunda/*' for repos with private bluefunda deps.
          Leave empty for public/OSS repos.
        required: false
        type: string
        default: ''
      working-directory:
        description: >
          Working directory for build, test, and lint steps.
          Use for monorepos where the Go module is in a subdirectory (e.g. backend).
        required: false
        type: string
        default: '.'
      build-command:
        required: false
        type: string
        default: 'go build ./...'
      test-command:
        required: false
        type: string
        default: 'go test -race ./...'
      golangci-lint-version:
        required: false
        type: string
        default: 'v2.15.0'
      run-codecov:
        required: false
        type: boolean
        default: false
      run-protobuf:
        required: false
        type: boolean
        default: false
      protoc-version:
        description: protoc release to install when run-protobuf is set.
        required: false
        type: string
        default: '29.3'
      runner:
        description: Runner label. Defaults to ubuntu-latest (GitHub-hosted). Pass self-hosted for private repos.
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      GH_PAT:
        description: GitHub PAT for private module access. Required when goprivate is set.
        required: false

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: bluefunda/.github/.github/actions/setup-go@main
        with:
          go-version: ${{ inputs.go-version }}
          gh-pat: ${{ secrets.GH_PAT }}
          goprivate: ${{ inputs.goprivate }}
          working-directory: ${{ inputs.working-directory }}
          cache: ${{ !contains(inputs.runner, 'self-hosted') }}
          protobuf: ${{ inputs.run-protobuf }}
          protoc-version: ${{ inputs.protoc-version }}

      - name: Generate proto files
        if: inputs.run-protobuf
        run: make proto

      - run: go mod download
      - run: ${{ inputs.test-command }}

      - name: Upload coverage
        if: inputs.run-codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ inputs.working-directory }}/coverage.txt
          # Best effort: a Codecov outage or TLS failure on a self-hosted
          # runner must not fail CI for every consumer.
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: bluefunda/.github/.github/actions/setup-go@main
        with:
          go-version: ${{ inputs.go-version }}
          gh-pat: ${{ secrets.GH_PAT }}
          goprivate: ${{ inputs.goprivate }}
          working-directory: ${{ inputs.working-directory }}
          cache: ${{ !contains(inputs.runner, 'self-hosted') }}
          protobuf: ${{ inputs.run-protobuf }}
          protoc-version: ${{ inputs.protoc-version }}

      - name: Generate proto files
        if: inputs.run-protobuf
        run: make proto

      - run: go mod download
      - run: ${{ inputs.build-command }}

  lint:
    name: Lint
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: bluefunda/.github/.github/actions/setup-go@main
        with:
          go-version: ${{ inputs.go-version }}
          gh-pat: ${{ secrets.GH_PAT }}
          goprivate: ${{ inputs.goprivate }}
          working-directory: ${{ inputs.working-directory }}
          cache: ${{ !contains(inputs.runner, 'self-hosted') }}
          protobuf: ${{ inputs.run-protobuf }}
          protoc-version: ${{ inputs.protoc-version }}

      - name: Generate proto files
        if: inputs.run-protobuf
        run: make proto

      - run: go mod download

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
          working-directory: ${{ inputs.working-directory }}
