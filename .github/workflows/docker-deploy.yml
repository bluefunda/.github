name: Docker Deploy

# Reusable workflow: builds a multi-arch Docker image, pushes to GHCR,
# and optionally updates a compose file in the gitops repo so Komodo redeploys.

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag for the Docker image (e.g. v1.2.3)
        required: true
        type: string
      image-name:
        description: Docker image name (defaults to the calling repo name)
        required: false
        type: string
        default: ""
      build-args:
        description: Additional Docker build arguments (one per line)
        required: false
        type: string
        default: ""
      context:
        description: Docker build context path (defaults to repo root)
        required: false
        type: string
        default: "."
      file:
        description: Path to Dockerfile (defaults to Dockerfile in context dir)
        required: false
        type: string
        default: ""
      gitops-repo:
        description: GitOps repo to update (org/repo). Leave empty to skip.
        required: false
        type: string
        default: ""
      gitops-compose-path:
        description: Path to the compose.yaml inside the gitops repo.
        required: false
        type: string
        default: ""
      platforms:
        description: >
          Docker build platforms (comma-separated). Pass linux/amd64,linux/arm64
          for multi-arch; QEMU is set up when an arm platform is requested.
        required: false
        type: string
        default: linux/amd64
      runner:
        description: Runner label. Defaults to ubuntu-latest (GitHub-hosted). Pass self-hosted for private repos.
        required: false
        type: string
        default: ubuntu-latest
      dockerfile-policy:
        description: >
          Dockerfile standard check (docs/dockerfile.md in bluefunda/.github):
          'warn' reports violations, 'enforce' fails before pushing, 'off' skips.
        required: false
        type: string
        default: warn
      push:
        description: >
          Push the image and update gitops. false builds and runs the
          Dockerfile checks only, e.g. to check a Dockerfile on a PR.
        required: false
        type: boolean
        default: true
    secrets:
      GH_PAT:
        description: GitHub PAT — required for private module build args and gitops update.
        required: false

jobs:
  build-and-push:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Docker host for rootless Docker
        run: |
          if [ ! -S /var/run/docker.sock ] && [ -S "/run/user/$(id -u)/docker.sock" ]; then
            echo "DOCKER_HOST=unix:///run/user/$(id -u)/docker.sock" >> "$GITHUB_ENV"
          fi
          if ! command -v docker >/dev/null 2>&1; then
            for dir in "$HOME/.local/bin" "$HOME/bin" /usr/local/bin; do
              if [ -x "$dir/docker" ]; then
                echo "$dir" >> "$GITHUB_PATH"
                break
              fi
            done
          fi

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64') || contains(inputs.platforms, 'arm/v')
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image name
        id: image
        run: |
          IMAGE_NAME="${{ inputs.image-name }}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="${GITHUB_REPOSITORY##*/}"
          fi
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Resolve Dockerfile path
        id: dockerfile
        run: |
          FILE="${{ inputs.file }}"
          if [ -z "$FILE" ]; then
            FILE="${{ inputs.context }}/Dockerfile"
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Resolve org version pins
        id: pins
        uses: bluefunda/.github/.github/actions/versions@main

      - name: Validate dockerfile-policy
        env:
          POLICY: ${{ inputs.dockerfile-policy }}
        run: |
          case "$POLICY" in
            warn|enforce|off) ;;
            *) echo "::error::dockerfile-policy must be warn, enforce or off (got '$POLICY')"; exit 1 ;;
          esac

      - name: Lint Dockerfile (hadolint)
        if: inputs.dockerfile-policy != 'off'
        env:
          POLICY: ${{ inputs.dockerfile-policy }}
          FILE: ${{ steps.dockerfile.outputs.path }}
        run: |
          # DL3002: last USER is root; DL3006: untagged image; DL3007: :latest.
          # These are raised to errors; everything else is advisory.
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w hadolint/hadolint:v2.12.0 \
            /bin/hadolint --no-fail --format json \
            --error DL3002 --error DL3006 --error DL3007 "$FILE" > "$RUNNER_TEMP/raw.json"

          # FROM ${GO_IMAGE} / ${ALPINE_IMAGE} / ${DISTROLESS_IMAGE} look untagged to
          # hadolint, but this workflow always sets them to a pinned tag and digest.
          PIN_LINES=$(awk 'toupper($1) == "FROM" && $2 ~ /^\$\{?(GO|ALPINE|DISTROLESS)_IMAGE\}?$/ { print NR }' "$FILE" | jq -s .)
          jq --argjson pins "$PIN_LINES" \
            'map(select(.code != "DL3006" or (.line as $l | any($pins[]; . == $l) | not)))' \
            "$RUNNER_TEMP/raw.json" > "$RUNNER_TEMP/hadolint.json"

          if [ "$POLICY" = enforce ]; then LEVEL=error; else LEVEL=warning; fi
          jq -r --arg level "$LEVEL" '.[] |
            "::\(if .level == "error" then $level else "notice" end) file=\(.file),line=\(.line)::hadolint \(.code): \(.message)"' \
            "$RUNNER_TEMP/hadolint.json"

          ERRORS=$(jq '[.[] | select(.level == "error")] | length' "$RUNNER_TEMP/hadolint.json")
          if [ "$ERRORS" -gt 0 ] && [ "$POLICY" = enforce ]; then
            echo "::error::$ERRORS Dockerfile policy violation(s) — see docs/dockerfile.md in bluefunda/.github"
            exit 1
          fi

      - name: Resolve native platform for policy check
        if: inputs.dockerfile-policy != 'off'
        id: native
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          case "$(uname -m)" in
            x86_64) NATIVE=linux/amd64 ;;
            aarch64|arm64) NATIVE=linux/arm64 ;;
            *) NATIVE="" ;;
          esac
          # Fall back to the first requested platform if the native one isn't built.
          if [ -z "$NATIVE" ] || [[ ",$PLATFORMS," != *",$NATIVE,"* ]]; then
            NATIVE="${PLATFORMS%%,*}"
          fi
          echo "platform=$NATIVE" >> "$GITHUB_OUTPUT"

      # Single-platform build loaded locally so the image config can be inspected
      # before anything is pushed. Its layers are reused by the multi-arch build below.
      - name: Build image for policy check
        if: inputs.dockerfile-policy != 'off'
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.dockerfile.outputs.path }}
          push: false
          load: true
          platforms: ${{ steps.native.outputs.platform }}
          build-args: |
            GH_PAT=${{ secrets.GH_PAT }}
            GO_VERSION=${{ steps.pins.outputs.go-version }}
            GO_IMAGE=${{ steps.pins.outputs.go-image }}
            ALPINE_IMAGE=${{ steps.pins.outputs.alpine-image }}
            DISTROLESS_IMAGE=${{ steps.pins.outputs.distroless-image }}
            ${{ inputs.build-args }}
          tags: policy-check:${{ github.sha }}
          cache-from: type=gha

      - name: Check image runs as non-root
        if: inputs.dockerfile-policy != 'off'
        env:
          POLICY: ${{ inputs.dockerfile-policy }}
        run: |
          IMAGE_USER=$(docker image inspect --format '{{.Config.User}}' "policy-check:${{ github.sha }}")
          case "${IMAGE_USER%%:*}" in
            ""|root|0)
              MSG="Image runs as root (USER='${IMAGE_USER}'). Set a non-root USER in the final stage — see docs/dockerfile.md in bluefunda/.github"
              if [ "$POLICY" = enforce ]; then
                echo "::error::$MSG"
                exit 1
              fi
              echo "::warning::$MSG"
              ;;
            *)
              echo "Image runs as '${IMAGE_USER}'"
              ;;
          esac

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ steps.dockerfile.outputs.path }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          build-args: |
            GH_PAT=${{ secrets.GH_PAT }}
            GO_VERSION=${{ steps.pins.outputs.go-version }}
            GO_IMAGE=${{ steps.pins.outputs.go-image }}
            ALPINE_IMAGE=${{ steps.pins.outputs.alpine-image }}
            DISTROLESS_IMAGE=${{ steps.pins.outputs.distroless-image }}
            ${{ inputs.build-args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.image.outputs.name }}:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.bluefunda.pins.go-image=${{ steps.pins.outputs.go-image }}
            com.bluefunda.pins.alpine-image=${{ steps.pins.outputs.alpine-image }}
            com.bluefunda.pins.distroless-image=${{ steps.pins.outputs.distroless-image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in gitops repo
        if: inputs.push && inputs.gitops-repo != '' && inputs.gitops-compose-path != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::warning::GH_PAT not set — skipping gitops update"
            exit 0
          fi
          git clone "https://x-access-token:${GH_PAT}@github.com/${{ inputs.gitops-repo }}.git" /tmp/gitops
          cd /tmp/gitops

          IMAGE_NAME="${{ steps.image.outputs.name }}"
          OWNER="${{ github.repository_owner }}"
          COMPOSE="${{ inputs.gitops-compose-path }}"

          sed -i "s|ghcr.io/${OWNER}/${IMAGE_NAME}:.*|ghcr.io/${OWNER}/${IMAGE_NAME}:${{ inputs.tag }}|" "$COMPOSE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$COMPOSE"
          if git diff --staged --quiet; then
            echo "No changes — gitops already up to date"
          else
            git commit -m "chore: update ${IMAGE_NAME} to ${{ inputs.tag }}"
            git push
          fi
