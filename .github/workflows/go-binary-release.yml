name: Go Binary Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.2.3)
        required: true
        type: string
      goreleaser-version:
        description: GoReleaser version
        required: false
        type: string
        default: '~> v2'
      goreleaser-args:
        description: GoReleaser arguments
        required: false
        type: string
        default: 'release --clean'
      goreleaser-config:
        description: Path to .goreleaser.yml (defaults to repo root)
        required: false
        type: string
        default: ''
      go-version:
        description: >
          Go version override. Leave empty to use the org pin
          (.github/actions/versions/Dockerfile in bluefunda/.github).
        required: false
        type: string
        default: ''
      go-version-file:
        description: Deprecated — ignored; the org pin (or go-version) is used.
        required: false
        type: string
        default: ''
      goprivate:
        description: >
          GOPRIVATE value for private module access.
          Set to '' for public/OSS repos with no private dependencies.
        required: false
        type: string
        default: 'github.com/bluefunda/*'
      goreleaser-runner:
        description: >
          Runner for the GoReleaser job. Use macos-latest to sign and notarize
          darwin binaries; keep ubuntu-latest if .goreleaser.yml builds Docker
          images (macOS runners have no Docker).
        required: false
        type: string
        default: 'ubuntu-latest'
      test-command:
        description: Test command to run before release (empty to skip)
        required: false
        type: string
        default: 'go test -race -count=1 ./...'
    secrets:
      GH_PAT:
        description: GitHub PAT for private module access. Only needed when goprivate is set.
        required: false
      HOMEBREW_TAP_TOKEN:
        description: GitHub PAT with write access to the Homebrew tap repo.
        required: false
      MACOS_CERTIFICATE:
        description: Base64-encoded Developer ID Application certificate (.p12).
        required: false
      MACOS_CERTIFICATE_PWD:
        description: Password for the macOS certificate.
        required: false
      NOTARIZATION_ISSUER_ID:
        description: App Store Connect API issuer ID for notarization.
        required: false
      NOTARIZATION_KEY_ID:
        description: App Store Connect API key ID for notarization.
        required: false
      NOTARIZATION_KEY:
        description: App Store Connect API private key (.p8 content) for notarization.
        required: false

jobs:
  test:
    name: Test
    if: inputs.test-command != ''
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: bluefunda/.github/.github/actions/setup-go@main
        with:
          go-version: ${{ inputs.go-version }}
          gh-pat: ${{ secrets.GH_PAT }}
          goprivate: ${{ inputs.goprivate }}

      - run: ${{ inputs.test-command }}

  goreleaser:
    needs: test
    # Run when tests passed or were skipped (empty test-command).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ inputs.goreleaser-runner }}
    permissions:
      contents: write
      id-token: write # OIDC token for cosign keyless (Sigstore/Fulcio) signing
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: bluefunda/.github/.github/actions/setup-go@main
        with:
          go-version: ${{ inputs.go-version }}
          gh-pat: ${{ secrets.GH_PAT }}
          goprivate: ${{ inputs.goprivate }}

      # Available for a repo's .goreleaser.yml to opt in to the sboms and signs
      # pipes; GoReleaser only invokes the tools its configured pipes name.
      - name: Install syft (GoReleaser SBOM pipe)
        uses: anchore/sbom-action/download-syft@v0

      - name: Install cosign (GoReleaser signing pipe)
        uses: sigstore/cosign-installer@v3
        with:
          # Last v2.x: cosign v3 dropped the --output-signature/--output-certificate
          # flags GoReleaser's signs pipe passes.
          cosign-release: "v2.6.4"

      - name: Resolve goreleaser config flag
        id: config
        env:
          CONFIG: ${{ inputs.goreleaser-config }}
        run: |
          if [ -n "$CONFIG" ]; then
            echo "flag=--config $CONFIG" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.goreleaser-args }} ${{ steps.config.outputs.flag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both names are in use across .goreleaser.yml files.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
          NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}
