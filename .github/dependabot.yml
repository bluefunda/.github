version: 2
updates:
  # This repo only holds reusable workflows, so GitHub Actions is the only
  # ecosystem to track. Dependabot does not inherit this file org-wide: each
  # repo keeps its own .github/dependabot.yml for gomod/docker/etc.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - infrastructure
